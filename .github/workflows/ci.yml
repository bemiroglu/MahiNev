name: Derleme ve doğrulama
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright cryptography && playwright install --with-deps chromium
      - run: python3 build.py
      - run: python3 tests/run_tests.py
      # Dil paketleri kaynakla eşleşmeli: Türkçe / İngilizce metin değişince fr, es, bs çevirisi de güncellenmeli
      - run: python3 tools/dil/pack_sync.py durum
      - uses: actions/upload-artifact@v4
        with: { name: mahinev, path: dist/mahinev.html }
