name: Rü'yet raporu / Sighting report
description: Programın ürettiği gözlem kaydını (JSON) paylaşın. Görmedim raporları da önemlidir.
title: "[Rü'yet] <akşam tarihi> <yer> — <gördüm/görmedim>"
labels: ["ruyet-raporu"]
body:
  - type: markdown
    attributes:
      value: |
        Bu form **haber** içindir; şer'î hüküm yetkili makama aittir (Se'âdet-i Ebediyye s. 315–316).
        Programda **Saha → Rü'yet kaydı → JSON** ile ürettiğiniz dosyanın içeriğini aşağıya yapıştırın.
        İletişim bilgilerinizi herkese açık bu alana yazmak istemiyorsanız JSON'dan `contact` alanını silebilirsiniz; bu durumda özet doğrulaması başarısız olur. Bunun yerine tutanağı doğrudan heyete iletin.
  - type: dropdown
    id: sonuc
    attributes:
      label: Sonuç
      options: ["Çıplak gözle gördüm", "Dürbünle bulup çıplak gözle gördüm", "Yalnız dürbün/teleskopla gördüm", "Yalnız fotoğrafla", "Görmedim"]
    validations: { required: true }
  - type: dropdown
    id: gok
    attributes:
      label: Gök durumu
      options: ["Açık", "Parçalı bulutlu", "Bulutlu (hilâl bulut arasından)", "Puslu / tozlu"]
    validations: { required: true }
  - type: textarea
    id: kayit
    attributes:
      label: Kayıt (JSON)
      render: json
    validations: { required: true }
  - type: textarea
    id: not
    attributes:
      label: Ek açıklama
  - type: checkboxes
    id: beyan
    attributes:
      label: Beyan
      options:
        - label: Bu kayıt kendi gözlemimdir; başkasından naklettiğim bir haber değildir.
          required: true
