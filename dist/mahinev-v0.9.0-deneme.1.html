  --ok: #1f7a4a; --ok-bg: #e0f1e7; --warn: #9c6200; --warn-bg: #faedd3; --bad: #b0352d; --bad-bg: #f7dfdc; --info: #3d5d86; --info-bg: #e2eaf4;
  --sky-day: #9fc0de; --sky-dusk: #f0c38c; --sky-night: #0f1a2e; --sky-glow: #ffb466; --sky-grid: #ffffff; --sky-text: #102035; --sky-star: #fff6d8; --moon: #fbf3d6; --ground: #2e3746; --sky-label: #f6f8fb; --sky-halo: rgba(4,9,18,.92);
  --map-sea: #cdd9e4; --map-land: #eef0ec; --map-coast: #6b7785; --map-border: #a3adb8; --map-iso: #7a4f00; --map-label-bg: rgba(255,255,255,.85); --map-mark: #ffffff; --map-mark-ring: #142030; --map-night: #0b1a33; --map-day: #fff4cf; --map-edge: #2b3746;

  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 10px; color-scheme: light;
}

  --map-sea: #0d1828; --map-land: #1d2a3c; --map-coast: #6f819a; --map-border: #3c4c63; --map-iso: #f2d16b; --map-label-bg: rgba(10,16,25,.85); --map-mark: #ffffff; --map-mark-ring: #0a1019; --map-night: #000208; --map-day: #9cc3f0; --map-edge: #d5deea;

  --accent: #9a5a12; --accent-ink: #ffffff;
  --ok: #1f7a4a; --ok-bg: #e0f1e7; --warn: #9c6200; --warn-bg: #faedd3; --bad: #b0352d; --bad-bg: #f7dfdc; --info: #3d5d86; --info-bg: #e2eaf4;
  --sky-day: #9fc0de; --sky-dusk: #f0c38c; --sky-night: #0f1a2e; --sky-glow: #ffb466; --sky-grid: #ffffff; --sky-text: #102035; --sky-star: #fff6d8; --moon: #fbf3d6; --ground: #2e3746; --sky-label: #f6f8fb; --sky-halo: rgba(4,9,18,.92);
  --map-sea: #cdd9e4; --map-land: #eef0ec; --map-coast: #6b7785; --map-border: #a3adb8; --map-iso: #7a4f00; --map-label-bg: rgba(255,255,255,.85); --map-mark: #ffffff; --map-mark-ring: #142030; --map-night: #0b1a33; --map-day: #fff4cf; --map-edge: #2b3746;
  --c-visible: #2e9e5b; --c-possible: #e3b21c; --c-below5: #e07b24; --c-below8: #c8402f; --c-notborn: #7d8794; --c-nosun: #4f5f78;
  color-scheme: light;
}
/* Gece teması: yalnızca koyu kırmızı tonlar; karanlığa alışmış gözü bozmaz */
body.th-night {
  --bg: #000000; --surface: #0a0000; --surface-2: #120201; --ink: #e0442f; --muted: #9a2e20; --line: #3a0b06;
  --accent: #ff5a3a; --accent-ink: #000000;
  --ok: #ff6a4f; --ok-bg: #2a0702; --warn: #c8432c; --warn-bg: #1c0402; --bad: #8c2618; --bad-bg: #160301; --info: #b8392a; --info-bg: #120201;
  --sky-day: #2a0703; --sky-dusk: #200502; --sky-night: #030000; --sky-glow: #4a1006; --sky-grid: #3a0b06; --sky-text: #e0442f; --sky-star: #ff6a4f; --moon: #ff7a5c; --ground: #000000; --sky-label: #ff6a4f; --sky-halo: #000000;
  --map-sea: #050000; --map-land: #170302; --map-coast: #6a1a10; --map-border: #3a0b06; --map-iso: #ff6a4f; --map-label-bg: rgba(0,0,0,.85); --map-mark: #ff7a5c; --map-mark-ring: #000000; --map-night: #000000; --map-day: #4a1006; --map-edge: #ff6a4f;
  --c-visible: #ff6a4f; --c-possible: #c2402b; --c-below5: #7a2415; --c-below8: #4a120a; --c-notborn: #220604; --c-nosun: #140303;
  color-scheme: dark;
}
/* Güneş altı: açık havada, parlak ışıkta en yüksek kontrast */
body.th-sun {
  --bg: #ffffff; --surface: #ffffff; --surface-2: #f1f1f1; --ink: #000000; --muted: #262626; --line: #1a1a1a;
  --accent: #8a3b00; --accent-ink: #ffffff;
  --ok: #005a24; --ok-bg: #d7f2df; --warn: #7a4300; --warn-bg: #ffe9b8; --bad: #9e0b00; --bad-bg: #ffd9d4; --info: #002f6c; --info-bg: #dde8f7;
  --sky-day: #7fa9d4; --sky-dusk: #e9a85f; --sky-night: #071226; --sky-glow: #ff9a3c; --sky-grid: #ffffff; --sky-text: #000000; --sky-star: #ffffff; --moon: #fff7d6; --ground: #1d232c; --sky-label: #ffffff; --sky-halo: #000000;
  --map-sea: #b9cde0; --map-land: #ffffff; --map-coast: #000000; --map-border: #555555; --map-iso: #5a3200; --map-label-bg: rgba(255,255,255,.95); --map-mark: #ffffff; --map-mark-ring: #000000; --map-night: #001033; --map-day: #fff1b8; --map-edge: #000000;
  --c-visible: #1a8a45; --c-possible: #e0a800; --c-below5: #e06a00; --c-below8: #c01e10; --c-notborn: #6b6b6b; --c-nosun: #3b4a66;
  color-scheme: light;
}
body.th-sun .card, body.th-sun .status { border-width: 2px; }
body.th-sun .small, body.th-sun .cap, body.th-sun dl.kv dt { color: #000; }
* { box-sizing: border-box; }
html, body { margin: 0; }
html { font-size: 16px; }
body { background: var(--bg); color: var(--ink); font: .9375rem/1.5 var(--font-body); }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1220px; margin: 0 auto; padding: 0 16px 40px; }
header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 16px 0 10px; }
.brand { display: flex; align-items: center; gap: 12px; flex: 1 1 300px; }
.brand svg { flex: none; }
.brand h1 { font: 600 1.4rem/1.15 var(--font-display); margin: 0; text-wrap: balance; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: .88rem; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; cursor: pointer; min-height: 34px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
select.compact { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; min-height: 34px; }
.stick { position: sticky; top: 0; z-index: 6; background: var(--bg); margin-bottom: 14px; }
.card { scroll-margin-top: 170px; }
nav.tabs { background: var(--bg); display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
nav.tabs a { padding: 11px 14px; text-decoration: none; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; font-weight: 500; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.notice { background: var(--info-bg); border-left: 3px solid var(--info); padding: 9px 14px; border-radius: 6px; font-size: .9rem; margin: 0 0 14px; }
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 16px; align-items: start; }
.layout > *, .grid2 > * { min-width: 0; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } .layout > aside { order: 2; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.card h2 { font: 600 1.05rem/1.3 var(--font-display); margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
.card h3 { font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 16px 0 8px; font-weight: 600; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.field label { font-size: .82rem; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 9px; min-width: 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 7px 11px; cursor: pointer; min-height: 36px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.q { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); font: 600 12px/1 var(--font-body); cursor: pointer; padding: 0; flex: none; }
.q:hover { color: var(--accent); border-color: var(--accent); }
.msg { font-size: .85rem; color: var(--bad); min-height: 1em; margin: 4px 0 0; }
.status { border-radius: var(--r); padding: 16px 18px; border: 1px solid var(--line); display: grid; grid-template-columns: 8px 1fr; gap: 0 14px; background: var(--surface); }
.status .bar { border-radius: 4px; background: var(--muted); }
.status h2 { margin: 0; font: 600 1.3rem/1.25 var(--font-display); text-wrap: balance; display: flex; gap: 8px; align-items: center; }
.status .sub { color: var(--muted); margin: 4px 0 10px; }
.status .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .88rem; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .82rem; font-weight: 500; }
.s-ok .bar { background: var(--ok); } .s-warn .bar { background: var(--warn); } .s-bad .bar { background: var(--bad); } .s-info .bar { background: var(--info); }
.p-ok { background: var(--ok-bg); color: var(--ok); } .p-warn { background: var(--warn-bg); color: var(--warn); } .p-bad { background: var(--bad-bg); color: var(--bad); } .p-info { background: var(--info-bg); color: var(--info); }
.best { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-top: 12px; }
.best .big { font: 500 2.1rem/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.best .lbl { color: var(--muted); font-size: .85rem; }
dl.kv { display: grid; grid-template-columns: minmax(150px, 1fr) auto; margin: 0; }
dl.kv dt, dl.kv dd { padding: 7px 0; border-bottom: 1px solid var(--line); margin: 0; }
dl.kv dt { color: var(--muted); font-size: .9rem; padding-right: 12px; display: flex; gap: 6px; align-items: flex-start; }
dl.kv dd { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
dl.kv dd small { display: block; color: var(--muted); font-size: .78rem; font-family: var(--font-body); }
dl.kv dd.txt { font-family: var(--font-body); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 1060px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.sky { width: 100%; height: auto; display: block; border-radius: 8px; }
.skyctl { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; margin-top: 10px; }
.skyctl input[type=range] { width: 100%; accent-color: var(--accent); min-height: 32px; }
.skyctl .tval { font: 600 1.15rem var(--font-mono); font-variant-numeric: tabular-nums; }
.readout { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 12px; }
.readout div { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
.readout b { display: block; font-size: .75rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.where { font-size: 1.05rem; margin: 12px 0 0; }
.flag { color: var(--warn); font-weight: 600; }
.cap { font-size: .82rem; color: var(--muted); margin: 8px 0 0; }
details.extra summary { cursor: pointer; font: 600 1.05rem/1.3 var(--font-display); }
details.extra p.note { color: var(--muted); font-size: .88rem; }
.lunar { font: 600 1.25rem/1.2 var(--font-mono); white-space: nowrap; }
.small { font-size: .85rem; color: var(--muted); }
table.t { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.t th, table.t td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t th { color: var(--muted); font-weight: 600; font-size: .8rem; }
table.t td.n { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
.prose { max-width: 78ch; }
.prose p { margin: 0 0 .8em; }
.prose h3 { font: 600 1rem var(--font-display); margin: 1.1em 0 .5em; text-transform: none; letter-spacing: 0; color: var(--ink); }
.prose .lab { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); font-weight: 600; margin: .8em 0 .2em; }
ul.check { padding-left: 1.2em; } ul.check li { margin: .35em 0; }
details.topic { border-bottom: 1px solid var(--line); padding: 8px 0; } details.topic summary { cursor: pointer; font-weight: 600; }
.guide-grid { display: grid; gap: 16px; }
/* harita */
.mapbox { position: relative; }
.mapbox canvas { display: block; width: 100%; border-radius: 8px; cursor: crosshair; }
.mapprog { position: absolute; top: 8px; left: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font: 500 .85rem var(--font-mono); }
.mapctl { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; margin-bottom: 12px; }
.mapctl .field { margin: 0; }
.chk { display: inline-flex; gap: 6px; align-items: center; font-size: .9rem; min-height: 32px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 10px 0 0; font-size: .85rem; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; border: 1px solid var(--line); }
.minimap { margin-top: 12px; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.facts div { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
.facts b { display: block; font-size: .75rem; color: var(--muted); font-weight: 600; }
.facts strong { font-size: 1rem; }
/* saha */
.field-top { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.clock { font: 600 3rem/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.cd { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
.cd div { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.cd b { display: block; font-size: .78rem; color: var(--muted); font-weight: 600; }
.cd span { font: 600 1.5rem var(--font-mono); font-variant-numeric: tabular-nums; }
.bigwhere { font-size: 1.3rem; line-height: 1.4; margin: 12px 0 0; }
.recbtns .btn { min-height: 52px; font-size: 1.05rem; padding: 10px 18px; }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); max-width: min(640px, 92vw); padding: 18px 20px; }
dialog::backdrop { background: rgba(0,0,0,.55); }
footer { color: var(--muted); font-size: .8rem; margin-top: 24px; }
.tb { margin-top: 4px; }
.tb svg { display: block; width: 100%; height: auto; }
.tb input[type=range] { width: 100%; accent-color: var(--accent); min-height: 34px; margin: 2px 0 0; }
.tbhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.tbhead .tval { font: 600 1.6rem/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.tbhead .utc { font: 500 .9rem var(--font-mono); color: var(--muted); }
.livepill { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 600; color: var(--ok); }
.livepill::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.obs { border-left: 4px solid var(--muted); padding: 8px 12px; border-radius: 6px; background: var(--surface-2); margin: 12px 0 0; }
.obs.ok { border-color: var(--ok); } .obs.no { border-color: var(--bad); } .obs.wait { border-color: var(--warn); }
.obs p { margin: 2px 0; }

    let nm = A.SearchMoonPhase(0, t.AddDays(-31), 31), last = null;
    while (nm && nm.ut <= t.ut) { last = nm; nm = A.SearchMoonPhase(0, nm.AddDays(1), 31); }
    return last;
  }
  function nextNewMoonAfter(t) { return A.SearchMoonPhase(0, t, 32); }
  function nearestNewMoon(t) {
    const p = lastNewMoonBefore(t), n = nextNewMoonAfter(t);
    if (!p) return n; if (!n) return p;
    return (t.ut - p.ut) <= (n.ut - t.ut) ? p : n;
  }

  // Yerel tarih (YYYY-MM-DD, IANA tz) → o günün yerel öğlesi (AstroTime)
  const TZF = new Map();   // saat dilimi biçimleyicileri önbelleği (hız)
  function tzOffsetMin(tz, date) {
    let f = TZF.get(tz);
    if (!f) { f = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }); TZF.set(tz, f); }
    const p = {}; for (const x of f.formatToParts(date)) p[x.type] = x.value;
    const asUTC = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second);
    return Math.round((asUTC - Math.floor(date.getTime() / 1000) * 1000) / 60000);
  }
  // Konumun yerel güneş öğlesi: YYYY-MM-DD tarihinin UTC gece yarısı + (12 − boylam/15) saat
  function solarNoon(ymd, lon) {
    const [y, m, d] = ymd.split('-').map(Number);
    return T(new Date(Date.UTC(y, m - 1, d) + (12 - lon / 15) * 3600000));
  }
  // Yerel duvar saati (YYYY-MM-DD + gece yarısından dakika, IANA tz) → UTC ms; yaz saati geçişlerinde de doğrudur.
  // Günün öncesindeki ve sonrasındaki saat farkı aday alınır; aranan ânda gerçekten geçerli olan seçilir. İleri alınan saatte
  // olmayan bir saat geçişten sonraki karşılığına, geri alınan saatte iki kez yaşanan bir saat ilk yaşanışına çevrilir.
  function localToUT(ymd, minutes, tz) {
    const [y, m, d] = ymd.split('-').map(Number);
    const wall = Date.UTC(y, m - 1, d) + minutes * 60000;
    const oB = tzOffsetMin(tz, new Date(wall - 86400000)), oA = tzOffsetMin(tz, new Date(wall + 86400000));
    const ok = [...new Set([oB, oA])].map(o => wall - o * 60000).filter(t => wall - tzOffsetMin(tz, new Date(t)) * 60000 === t);
    return ok.length ? Math.min(...ok) : wall - oB * 60000;   // iki kez yaşanan saat → ilki; olmayan saat → geçişten sonraki karşılığı
  }
  // Saat diliminin yerel gece yarısı (UTC ms)
  function tzMidnight(ymd, tz) { return localToUT(ymd, 0, tz); }
  function localNoon(ymd, tz) {
    const [y, m, d] = ymd.split('-').map(Number);
    let guess = Date.UTC(y, m - 1, d, 12);
    const off = tzOffsetMin(tz, new Date(guess));
    return T(new Date(guess - off * 60000));
  }

  // ---- Akşam rü'yet değerlendirmesi ----
  function evening(loc, ymd) {
    const obs = new A.Observer(loc.lat, loc.lon, (loc.elev || 0) + (loc.hObs || 0));
    const hObs = loc.hObs || 0, hMax = loc.hMax != null ? loc.hMax : hObs;
    const noon = solarNoon(ymd, loc.lon);   // konumun güneş öğlesi (saat diliminden bağımsız)
    const ss = zahiriSet('Sun', obs, hObs, noon, 1);
    if (!ss) return { ok: false, reason: 'noSunset' };
    const r = { ok: true, loc, ymd, gurub: ss };
    const nmPrev = lastNewMoonBefore(ss), nmNext = nextNewMoonAfter(ss);
    r.ictimaPrev = nmPrev; r.ictimaNext = nmNext;
    r.ageH = nmPrev ? (ss.ut - nmPrev.ut) * 24 : null;
    r.beynunet = beynunet(ss);
    const m = topo('Moon', ss, obs), s = topo('Sun', ss, obs);
    r.moonAlt = m.alt; r.moonAz = m.az; r.sunAz = s.az;
    r.moonGeoAlt = geoAlt('Moon', ss, obs);
    r.daz = ((s.az - m.az) + 540) % 360 - 180;   // + : ay güneşin solunda (güneyinde)
    r.illum = A.Illumination('Moon', ss).phase_fraction * 100;
    r.moonUp = upperLimbAboveVisible('Moon', ss, obs, hObs) > 0;
    if (r.moonUp) { r.moonset = zahiriSet('Moon', obs, hObs, ss, 1); }
    else { r.moonset = lastSetBefore('Moon', obs, hObs, ss); }
    r.lagMin = r.moonset ? (r.moonset.ut - ss.ut) * 1440 : null;
    // Şer'î gurûb, temkin
    r.seri = seriGurub(obs, hMax, noon);
    // Şafak (yatsı vakti), Tam İlmihâl s. 178, 194, 197:
    //  İmâm-ı a'zam: beyâzlık kaybolunca (−19°) — esas, ihtiyâtlı olan; İmâmeyn: kırmızılık kaybolunca (−17°) — alternatif.
    //  Hesap usulü (s. 197): güneş merkezinin hakîkî ufka göre irtifâından hakîkî vakit bulunur, buna temkin eklenerek şer'î vakit olur.
    const tem = r.seri && r.seri.temkinMin != null ? r.seri.temkinMin : 0;
    r.safak19h = A.SearchAltitude('Sun', obs, -1, ss, 1, K.SAFAK_EBYAD);
    r.safak17h = A.SearchAltitude('Sun', obs, -1, ss, 1, K.SAFAK_AHMAR);
    r.safak19 = r.safak19h ? r.safak19h.AddDays(tem / 1440) : null;
    r.safak17 = r.safak17h ? r.safak17h.AddDays(tem / 1440) : null;
    r.safakTemkin = tem;
    if (r.moonUp && r.moonset) {
      r.kadihan19 = r.safak19 ? (r.moonset.ut > r.safak19.ut ? 'second' : 'first') : 'second';
      r.kadihan17 = r.safak17 ? (r.moonset.ut > r.safak17.ut ? 'second' : 'first') : 'second';
      r.kadihanDiffer = r.kadihan19 !== r.kadihan17;
    }
    // Kitabın gözlem penceresi: zâhirî gurûb → hilâlin görünen irtifâı 5°'ye inene kadar (D2)
    if (r.moonUp && r.moonAlt >= K.MIN_ALT && r.moonset) {
      r.windowEnd = bisect(t => topo('Moon', t, obs).alt - K.MIN_ALT, ss, r.moonset);
    }
    // Yallop (1997) en iyi an ve q; Odeh (2004) V — ek bilgi (D4: an ana panelde)
    if (r.moonUp && r.lagMin > 0) {
      const tb = ss.AddDays(r.lagMin * 4 / 9 * MIN);
      r.best = tb;
      const ms = topo('Moon', tb, obs), su = topo('Sun', tb, obs);
      // Yallop (1997, NAO TN 69 §2–3): ARCL ve ARCV jeosentrik (havasız); W' = SD' (1 − cos ARCL), SD' toposentrik yarıçap.
      // Odeh (2004): ARCL, ARCV ve W toposentrik (havasız). iki model kendi tanımıyla ayrı hesaplanıyor.
      const arclTopo = sep(su.ra, su.dec, ms.ra, ms.dec), arclGeo = beynunet(tb);
      const sdMoonArcmin = deg(Math.asin(MOON_R_KM / (ms.distAU * AU_KM))) * 60;
      const Wy = sdMoonArcmin * (1 - Math.cos(rad(arclGeo))), W = sdMoonArcmin * (1 - Math.cos(rad(arclTopo)));
      const arcvGeo = geoAlt('Moon', tb, obs) - geoAlt('Sun', tb, obs);
      const arcvTopo = ms.airAlt - su.airAlt;
      const poly = w => 11.8371 - 6.3226 * w + 0.7319 * w * w - 0.1018 * w * w * w;
      const q = (arcvGeo - poly(Wy)) / 10;
      const V = arcvTopo - (-0.1018 * W ** 3 + 0.7319 * W ** 2 - 6.3226 * W + 7.1651);
      r.bestMoonAlt = ms.alt; r.bestMoonAz = ms.az; r.bestSunAlt = su.alt; r.bestSunAz = su.az;
      r.W = W; r.Wy = Wy; r.arcl = arclTopo; r.arclGeo = arclGeo; r.arcvGeo = arcvGeo; r.arcvTopo = arcvTopo;
      r.yallopQ = q;
      r.yallop = q > 0.216 ? 'A' : q > -0.014 ? 'B' : q > -0.160 ? 'C' : q > -0.232 ? 'D' : q > -0.293 ? 'E' : 'F';
      r.odehV = V;
      r.odeh = V >= 5.65 ? 'A' : V >= 2 ? 'B' : V >= -0.96 ? 'C' : 'D';
    }
    r.cls = classify(r);
    return r;
  }

  // Se'âdet-i Ebediyye sınıflandırması (rapor B.4 tablosu; sırayla, ilk tutan geçerli)
  function classify(r) {
    const SYN_H = 29.53 * 24;
    if (r.ageH == null) return { code: 'notBorn', sub: 'beforeConj', reject: true };
    // Gurûb bir sonraki ictimâya yakınsa (ay sonu): yeni hilâl henüz doğmamıştır
    if (r.ageH > SYN_H / 2) {
      const toNext = r.ictimaNext ? (r.ictimaNext.ut - r.gurub.ut) * 24 : 99;
      return toNext < 72 ? { code: 'notBorn', sub: 'beforeConj', reject: true } : { code: 'midMonth', reject: false };
    }
    if (r.ageH > 96) return { code: 'midMonth', reject: false };
    if (!r.moonUp || (r.lagMin != null && r.lagMin <= 0)) return { code: 'notBorn', sub: 'moonFirst', reject: true };
    if (r.beynunet < K.BOOK_MIN_ELONG) return { code: 'below8', reject: true, modernBelow: r.beynunet < K.MODERN_MIN_ELONG };
    if (r.moonAlt < K.MIN_ALT) return { code: 'below5', reject: false };
    if (r.beynunet < K.OTTOMAN_ELONG) return { code: 'possible', reject: false };
    return { code: 'visible', reject: false };
  }

  // 18° anı ve o anda güneşin battığı boylam (s. 360 usulü), verilen enlem için
  function moment18(conj, lat) {
    if (!conj) return null;
    let a = conj, b = conj.AddDays(3);
    if (beynunet(a) >= K.OTTOMAN_ELONG) return null;
    const t = bisect(x => beynunet(x) - K.OTTOMAN_ELONG, a, b);
    const v = A.RotateVector(A.Rotation_EQJ_EQD(t), A.GeoVector('Sun', t, true));
    const eq = A.EquatorFromVector(v);
    const h0 = -0.8333, phi = rad(lat), dec = rad(eq.dec);
    const cosH = (Math.sin(rad(h0)) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec));
    if (Math.abs(cosH) > 1) return { t, lon: null };
    const H = deg(Math.acos(cosH));
    let lon = H - (A.SiderealTime(t) * 15 - eq.ra * 15);
    lon = ((lon + 540) % 360) - 180;
    return { t, lon };
  }

  // Verilen anda, verilen enlemde güneşin battığı boylam
  function sunsetLon(t, lat) {
    const v = A.RotateVector(A.Rotation_EQJ_EQD(t), A.GeoVector('Sun', t, true));
    const eq = A.EquatorFromVector(v);
    const phi = rad(lat), dec = rad(eq.dec);
    const cosH = (Math.sin(rad(-0.8333)) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec));
    if (Math.abs(cosH) > 1) return null;
    let lon = deg(Math.acos(cosH)) - (A.SiderealTime(t) * 15 - eq.ra * 15);
    return ((lon + 540) % 360) - 180;
  }
  // Hızlı akşam testi (en erken gün taraması için; deniz seviyesi, standart gurûb)
  function quickEvening(lat, lon, startUT) {
    const obs = new A.Observer(lat, lon, 0);
    const ss = A.SearchRiseSet('Sun', obs, -1, startUT, 1);
    if (!ss) return null;
    const m = topo('Moon', ss, obs);
    return { ss, elong: beynunet(ss), alt: m.alt };
  }
  // Hesâbî en erken gün (D3): beynûnet ≥ 8° ve görünen irtifâ ≥ 5° şartının ilk sağlandığı akşamın ertesi günü.
  // dateUTC: ictimânın UTC tarihi (Date). places: [[lat,lon],...] veya null (küresel ızgara).
  function earliestDay(conj, places, onProgress) {
    // Bir yerel tarihin en geç gurûbu tarih çizgisinin hemen doğusunda olur; aynı enlemde o tarih için en elverişli akşam oradadır.
    // Bu yüzden küresel arama bu boylam kuşağında, kutup daireleri arasında (±66°) yapılır. tools/kuresel_dogrulama.py,
    // bütün dünya ızgarasıyla aynı günün bulunduğunu doğrular.
    const grid = places || (() => { const g = []; for (let la = -66; la <= 66; la += 3) for (let lo = -177.5; lo <= -140; lo += 5) g.push([la, lo]); return g; })();
    const cd = conj.date;
    const base = Date.UTC(cd.getUTCFullYear(), cd.getUTCMonth(), cd.getUTCDate());
    for (let k = 0; k <= 3; k++) {
      let hit = null;
      for (let i = 0; i < grid.length; i++) {
        const [la, lo] = grid[i];
        const localNoonUT = base + k * 86400000 + (12 - lo / 15) * 3600000;   // o boylamın yerel güneş öğlesi
        const t0 = T(new Date(localNoonUT));
        if (t0.ut + 0.6 < conj.ut) continue;
        const q = quickEvening(la, lo, t0);
        if (!q || q.ss.ut < conj.ut) continue;
        if (q.elong >= K.BOOK_MIN_ELONG && q.alt >= K.MIN_ALT) {
          if (!hit || q.elong > hit.elong) hit = { lat: la, lon: lo, elong: q.elong, alt: q.alt, ss: q.ss };
        }
      }
      if (onProgress) onProgress(k);
      if (hit) {
        const ev = new Date(base + k * 86400000);          // gözlem yerinin yerel tarihi (akşam)
        const first = new Date(base + (k + 1) * 86400000); // ay başı: ertesi gün
        return { evening: ev, first, where: hit };
      }
    }
    return null;
  }


  // ---- Harita hücresi (deniz seviyesi, standart gurûb; hızlı) ----
  // dayUTC: yerel tarihin UTC gece yarısı (ms). conj: ayın ictimâsı (AstroTime).
  function cell(lat, lon, dayUTC, conj, withModern) {
    const obs = new A.Observer(lat, lon, 0);
    const t0 = T(new Date(dayUTC + (12 - lon / 15) * 3600000));
    const ss = A.SearchRiseSet('Sun', obs, -1, t0, 1);
    if (!ss) return { code: 'noSunset' };
    const ageH = (ss.ut - conj.ut) * 24;
    const m = topo('Moon', ss, obs);
    const sdM = deg(Math.asin(MOON_R_KM / (m.distAU * AU_KM)));
    const elong = beynunet(ss);
    const out = { ageH, elong, alt: m.alt, up: m.alt + sdM, ss };
    if (ageH < 0) out.code = 'notBorn';
    else if (m.alt + sdM <= 0) out.code = 'notBorn';
    else if (elong < K.BOOK_MIN_ELONG) out.code = 'below8';
    else if (m.alt < K.MIN_ALT) out.code = 'below5';
    else if (elong < K.OTTOMAN_ELONG) out.code = 'possible';
    else out.code = 'visible';
    if (withModern && out.code !== 'notBorn') {
      const ms = A.SearchRiseSet('Moon', obs, -1, ss, 1);
      if (ms) {
        const lag = (ms.ut - ss.ut) * 1440;
        if (lag > 0 && lag < 600) {
          const tb = ss.AddDays(lag * 4 / 9 / 1440);
          const mo = topo('Moon', tb, obs), su = topo('Sun', tb, obs);
          const arcl = sep(su.ra, su.dec, mo.ra, mo.dec), sd = deg(Math.asin(MOON_R_KM / (mo.distAU * AU_KM))) * 60;
          const W = sd * (1 - Math.cos(rad(arcl))), Wy = sd * (1 - Math.cos(rad(beynunet(tb))));
          const poly = w => 11.8371 - 6.3226 * w + 0.7319 * w * w - 0.1018 * w * w * w;
          out.q = (geoAlt('Moon', tb, obs) - geoAlt('Sun', tb, obs) - poly(Wy)) / 10;
          out.V = (mo.airAlt - su.airAlt) - (-0.1018 * W ** 3 + 0.7319 * W ** 2 - 6.3226 * W + 7.1651);
        }
      }
    }
    return out;
  }
  // Bir yerin bu ay için ilk elverişli akşamı (0–3 gün sonrası); bulunamazsa null
  function firstEvening(lat, lon, conj) {
    const cd = conj.date, base = Date.UTC(cd.getUTCFullYear(), cd.getUTCMonth(), cd.getUTCDate());
    for (let k = 0; k <= 3; k++) {
      const c = cell(lat, lon, base + k * 86400000, conj, false);
      if (c.code === 'noSunset') return { k: -1 };
      if (c.code === 'visible' || c.code === 'possible') return { k, day: base + k * 86400000 };
    }
    return null;
  }

  // ---- Gökyüzündeki diğer cisimler (yön bulma ve karıştırılma uyarısı için) ----
  const PLANETS = ['Mercury', 'Venus', 'Mars', 'Jupiter', 'Saturn'];
  const STARS = [ // J2000: ad, RA (saat), Dec (°), kadir
    ['Sirius', 6.7525, -16.716, -1.46], ['Canopus', 6.3992, -52.696, -0.74], ['Rigil Kentaurus', 14.6600, -60.835, -0.27], ['Arcturus', 14.2610, 19.182, -0.05],
    ['Vega', 18.6156, 38.784, 0.03], ['Capella', 5.2782, 45.998, 0.08], ['Rigel', 5.2423, -8.202, 0.13], ['Procyon', 7.6550, 5.225, 0.34],
    ['Achernar', 1.6286, -57.237, 0.46], ['Betelgeuse', 5.9195, 7.407, 0.50], ['Hadar', 14.0637, -60.373, 0.61], ['Altair', 19.8464, 8.868, 0.76],
    ['Acrux', 12.4433, -63.099, 0.76], ['Aldebaran', 4.5987, 16.509, 0.86], ['Antares', 16.4901, -26.432, 0.96], ['Spica', 13.4199, -11.161, 0.97],
    ['Pollux', 7.7553, 28.026, 1.14], ['Fomalhaut', 22.9608, -29.622, 1.16], ['Deneb', 20.6905, 45.280, 1.25], ['Regulus', 10.1395, 11.967, 1.35],
    ['Castor', 7.5767, 31.888, 1.58], ['Polaris', 2.5303, 89.264, 1.98]];
  function skyObjects(t, obs) {
    const out = [];
    for (const b of PLANETS) {
      const p = topo(b, t, obs);
      out.push({ id: b, kind: 'planet', alt: p.alt, az: p.az, mag: A.Illumination(b, t).mag });
    }
    const rot = A.Rotation_EQJ_EQD(t);
    for (const [name, ra, dec, mag] of STARS) {
      const v = A.RotateVector(rot, A.VectorFromSphere(new A.Spherical(dec, ra * 15, 1), t));
      const eq = A.EquatorFromVector(v);
      const h = A.Horizon(t, obs, eq.ra, eq.dec, 'normal');
      out.push({ id: name, kind: 'star', alt: h.altitude, az: h.azimuth, mag });
    }
    return out;
  }
  // Alacakaranlık evreleri (güneş merkezinin geometrik irtifâı)
  function twilight(obs, ss) {
    const f = a => A.SearchAltitude('Sun', obs, -1, ss.AddDays(-0.02), 1, a);
    return { civil: f(-6), nautical: f(-12), ahmar: f(K.SAFAK_AHMAR), ebyad: f(K.SAFAK_EBYAD) };
  }
  // Belirli bir anda güneş ve ay konumu (ufuk çizimi ve saha modu için)
  function at(t, loc) {
    const obs = new A.Observer(loc.lat, loc.lon, (loc.elev || 0) + (loc.hObs || 0));
    const m = topo('Moon', t, obs), s = topo('Sun', t, obs);
    return { t, moon: m, sun: s, elong: beynunet(t), obs };
  }

  // ---- Sabah hilâli (ay sonu, ictimâdan önce; yalnızca bilgi) ----
  function morning(loc, ymd) {
    const obs = new A.Observer(loc.lat, loc.lon, (loc.elev || 0) + (loc.hObs || 0));
    const start = T(new Date(solarNoon(ymd, loc.lon).date.getTime() - 12 * 3600000));
    const sr = A.SearchRiseSet('Sun', obs, +1, start, 1, loc.hObs || 0);
    if (!sr) return null;
    const nm = nextNewMoonAfter(sr.AddDays(-0.2));
    const toConjH = nm ? (nm.ut - sr.ut) * 24 : null;
    const m = topo('Moon', sr, obs), e = beynunet(sr);
    let code = 'none';
    if (toConjH != null && toConjH > 0 && toConjH < 4 * 24) code = m.alt < 0 ? 'moonBelow' : e < K.BOOK_MIN_ELONG ? 'below8' : m.alt < K.MIN_ALT ? 'below5' : 'possible';
    return { sunrise: sr, moonAlt: m.alt, moonAz: m.az, elong: e, toConjH, code };
  }
  // ---- Bir yerel gün içinde güneş ve ay doğuş/batış (saat dilimine göre gün) ----
  function dayEvents(loc, ymd, tz) {
    const obs = new A.Observer(loc.lat, loc.lon, (loc.elev || 0) + (loc.hObs || 0));
    const t0 = T(new Date(tzMidnight(ymd, tz)));
    const f = (b, dir) => { const x = A.SearchRiseSet(b, obs, dir, t0, 1, loc.hObs || 0); return x && x.ut < t0.ut + 1 ? x : null; };
    return { start: t0, sunrise: f('Sun', +1), sunset: f('Sun', -1), moonrise: f('Moon', +1), moonset: f('Moon', -1) };
  }
  // ---- Anlık küresel konumlar (harita için analitik, aramasız) ----
  function instant(t) {
    const rot = A.Rotation_EQJ_EQD(t);
    const sv = A.EquatorFromVector(A.RotateVector(rot, A.GeoVector('Sun', t, true)));
    const mvv = A.GeoVector('Moon', t, true), mv = A.EquatorFromVector(A.RotateVector(rot, mvv));
    const gast = A.SiderealTime(t) * 15;
    const hp = deg(Math.asin(6378.14 / (mvv.Length() * AU_KM)));
    const last = lastNewMoonBefore(t);
    return { sun: { ra: sv.ra * 15, dec: sv.dec }, moon: { ra: mv.ra * 15, dec: mv.dec }, gast, hp, elong: beynunet(t), ageH: last ? (t.ut - last.ut) * 24 : null,
      subSolar: { lat: sv.dec, lon: ((sv.ra * 15 - gast + 540) % 360) - 180 }, subLunar: { lat: mv.dec, lon: ((mv.ra * 15 - gast + 540) % 360) - 180 } };
  }
  // Bir konumda anlık yükseklik (yaklaşık; harita pikselleri için). Ay için paralaks ve kırılma dahil.
  function altFast(ra, dec, gast, lat, lon) {
    const H = rad(gast + lon - ra), p = rad(lat), d = rad(dec);

window.HR_CANON_TR = ["Süâl: Hicrî Kamerî ay başı ile takvîmlerde bildirilen Hicrî Kamerî ay başları arasındaki münâsebeti doğru olarak nasıl anlamalıdır? Yani, takvîmlerde bildirilen Hicrî Kamerî ay başları, gerçek Hicrî Kamerî ay başları mıdır?", "Oruc, Hac ve Kurban İbâdetlerinin kabûl olması için, doğru zamanlarında yapılması şart olduğundan, dinimizin bu ibâdetler için bildirdiği doğru zamanlarını öğrenmek maksadıyla, bu süâli soruyoruz. Bu husûslarda takvîmlere güvenilir mi?", "Cevâb: Bu husûsda hiçbir takvîme güvenilemez. Açıklaması aşağıdadır.", "1. Genel Malûmat", "Bu konuda öncelikle bilinmesi gereken iki husûs vardır.", "Birincisi, “Yeni ayın hilâlinin doğması”, ikincisi “Yeni ayın hilâlin görülmesi (yâ’ni Rü’yet-i Hilâl)” kavramlarıdır.", "Yeni ayın hilâlinin doğması demek, hilâlin görülmesi demek değildir. Hilâlin doğması, bir hesâb işlemidir. Yani, hilâlin doğacağı vaktin hesâbla bulunması demekdir.", "Yeni ayın hilâlinin görülmesi (Rü’yet-i Hilâl) ise, hilâlin çıplak göz ile görülmesidir. Rü’yet-i Hilâl vaktinin hesâbı yapılamaz. Ya’ni yeni ayın hilâlinin görülmesi vaktinin hesâbı yoktur.", "Kamer (Ay) dünyâ etrafındaki her devrinde, bir kerre, ay ile güneş, yer küresinin aynı tarafında olarak, üçü bir doğrultuda bulunuyorlar. Bu hâle (İctimâ’ı neyyireyn=Conjunction) denir. Bu hâlde iken, kamerin [ayın] bize karşı olan yüzü karanlık oluyor. Ayı göremiyoruz. Bu zemâna (Muhak) denir. Muhak zemânı sâbit değildir. Yirmisekiz sâat ile yetmişiki sâat arasında değişmekdedir. İctimâ’ vakti, Muhak zemânının tam ortası olup, ilmî takvîmlerde her ay için yazılıdır.", "Takıyyuddîn Muhammed ibni Dakîk diyor ki, (İctimâ’ı neyyireyn)den 1-2 gün geçmeden, hilâl hiç görülemez.", "2. Ramezân’ın başı ve Bayram ile âlâkalı açıklamalar", "Takvîmler, hilâlin görülmesini değil, doğmasını bildirdikleri için, Ramezân ayının başlaması, takvîmle anlaşılamaz.", "Hilâlin doğması, görmekle değil, hesâbla anlaşılır. Hesâbın bildirdiği kesin doğru olur. Fekat, hilâl doğduğu gece görülebileceği gibi, o gece görülemeyip, ikinci gecesi de görülebilir. Bu hesâblar, kamerî ayın başladığı vakti bulmak için değildir. Hilâlin görülebileceği geceyi anlamak içindir. Daha geniş ma’lûmât için (YENİ) Rü'yet-i Hilâl linkine tıklayınız.", "Hicrî Kamerî sene içinde, Hicrî Kamerî aylara ait hilâlin doğacağı vaktleri hesâb etmek, kat’î olarak mümkün olduğu halde, hilâlin çıplak gözle ve Erd sathından (yerden) görülmesi, ancak rasad ile mümkündür. Hicrî kamerî ay başları, yeni ayın hilâlinin, çıplak gözle rasad yapılarak görülmesi ile kesinleşir. Takvîmler önceden hâzırlandığı için, takvîmlerde bildirilen hicrî ay başları hesâbla bulunur. İbâdetler için, rü’yet-i hilâl ile kesinleşen hicrî kamerî ay başları esâs alınır.", "Hicrî Kamerî Yeni Ayın hilâlinin gözle görülme olayına, Rü’yet-i Hilâl denilmektedir. Binlerce sene geriye doğru yapılan araştırmalar neticesinde, yeni ayın hilâlinin görüleceği vaktin, ya’ni rü’yet-i hilâl ile hicrî kamerî ay başlarının tesbiti hesâb ile mümkün olamamışdır. Rü’yet-i Hilâlin, hem geçmişe ve hem de geleceğe dönük olarak, vaktinin hesâbını yapmak mümkün değildir. Onun için takvimlere güvenilmez, mutlaka rü’yet-i hilâl şartdır. Bu da Peygamber Efendimizin “sallallahü aleyhi ve sellem” (Hilâli görünce oruca başlayınız!) hadîs-i şerîfindeki mu’cizesidir.", "Hicrî takvîmlerde bazı aylar 29, bazı aylar ise, 30 gün çekerler. Ancak bu aylarda düzenli ve dönüşümlü bir sıralanma yoktur. Arka arkaya 29 veya 30 gün süren aylar olduğu gibi, bir sene 29 gün süren bir hicrî ay, ertesi sene 30 gün sürebilmektedir. Semâda, Ramezân-ı şerîf hilâlini aramak, bir ibâdetdir. Görülüyor ki, Ramezân-ı şerîf başlangıcını önceden haber vermek, islâmiyyeti bilmemek alâmetidir. Bunun içindir ki, Hicrî-Kamerî takvîmin hesâblara bağlı olarak tesbiti, İslâm âlimlerince câiz olmadığı bildirilmişdir. Bunun için de oruc, hac ve kurban ibâdetlerinin edâsında takvîmlere güvenilmez.", "Târîh araştırıcılarının doğru târîhleme yapabilmeleri için, geçmişe dönük olmak ve takvîmler arası târîh çevirme cedvellerinin düzenlenmesinde kullanılmak üzere, ay sonlarında artan müddetleri 0.5 günden fazla ise, tam gün alınarak o ay’ın 30 gün olduğunun kabulü kaidesiyle takvîmler hâzırlanmakdadır.", "(İbni Âbidîn), birinci cild, ikiyüzseksendokuzuncu sahîfede, kıble ta’yînini bildirirken, diyor ki: (Ramezân-ı şerîfin birinci gününü anlamakda takvîmlere güvenilmemelidir. Çünki oruc, gökde yeni ayı görmekle farz olur. Peygamberimiz “sallallahü aleyhi ve sellem”, (Hilâli görünce oruca başlayınız!) buyurdu. Hâlbuki hilâlin doğması, görmekle değil, hesâbladır ve hesâb sahîh olup, hilâl, hesâbın bildirdiği gecede doğar. Fekat, o gece görülmeyip, bir gece sonra görülebilir ve oruca, hilâlin doğduğu gece değil, görüldüğü gece başlamak lâzımdır. Çünki, islâmiyyet böyle emr buyurmuşdur).", "Takvîmlerde bildirilen geceden önceki gecede (Hilâli gördük) demek yanlışdır. İslâm âlimlerinden imâm-ı Sübkî “rahime-hüllahü teâlâ”, (Şa’bânın otuzuncu gecesi hilâli gördüğünü söyliyen olsa, hesâb ile, hilâlin bir gece sonra doğacağı bildirilse, burada hesâba inanılır. Çünki, hesâbla anlaşılan kat’îdir. Doğmadan bir gece evvel görülmesi imkânsızdır) diyor. [Hilâli görmekle Ramezânın başlaması, hesâbla anlaşılandan bir gün sonra olabilir. Fekat bir gün önce olamaz.] Bu hesâblar, kamerî ayın başladığı vakti bulmak için değildir. Hilâlin görülebileceği geceyi anlamak içindir. İmâm-ı Sübkî de böyle buyurdu. İmâmın sözünü tersine çevirenlere aldanmamalıdır.", "Her asrda, her yerde, Ramezân ayı, hilâli görmekle başlardı. Şimdi, Ramezân ayı, hilâlin doğma zemânını hesâb etmekle başlatılıyor. Ramezânın başlaması, ahkâm-ı islâmiyyeye uygun olmuyor.", "Ramezâna ve bayrama takvîm ile, hesâb ile başlamak câiz olmadığı (Fetâvâ-ı Hindiyye)de de yazılıdır.", "Bir yerde Ramezân başlayınca, dünyânın her yerinde oruca başlamak lâzım olur.", "3. Zil-hicce ayının başı ile âlâkalı malûmat", "Kurban bayramının birinci günü, Zil-hicce ayının hilâlini görmekle anlaşılır. Zil-hicce ayının dokuzuncu Arefe günü, hesâbla, takvîmle anlaşılan gün veyâ bundan bir gün sonra olur. Bundan bir gün önce Arafâta çıkanların hacları sahîh olmuyor. Hiçbiri hâcı olamıyor.", "Haccın üç farzından biri Arafâtda arefe günü vakfeye durmaktır. Arafâtda vakfeye durmanın evvelki vakti, Zil-hiccenin dokuzuncu günü zevâl vaktinden, ertesi günü, sabâh oluncıya dekdir. [Bir gün önce veyâ bir gün sonra Arafâtda vakfeye durunca, hac bâtıl olur. Vaktinde vakfeye durmıyanların hacları sahîh olmuyor.]", "Ramezân ve bayram aylarının şâhidlerle meşrû’ olarak anlaşılmadığı yerlerde, Zil-hicce ayının birinci günü ve buradan da onuncu günü, ya’nî kurban bayramının birinci günü hesâb edilir. Bayramın birinci günü, bu hesâb ile bulunan gündür. Yâhud, bir gün sonradır. Bir gün evvel olamaz. Çünki, gökde, ay, doğmadan önce görülemez.", "Bir yerde Ramezân başlayınca, dünyânın her yerinde oruca başlamak lâzım olur. Hac, kurban ve nemâz vaktleri böyle değildir. Bunlar vaktlerinin bir yerde ma’lûm olması ile, başka yerlerde de böyle olmaları lâzım gelmez.)) [Ya'nî bu üçü mahallîdir.]", "İslâm âlimlerinin yukarıdaki buyurduklarına uymıyan yazılar, beyânlar yanlıştır, kıymetsizdir ve hiç muteber değildir."];

    'Question: How should the relation between the true beginning of a Hijri lunar month and the month beginnings printed in calendars be understood? Are the month beginnings in calendars the true ones?',
    'Since fasting, Hajj and Qurban are accepted only when performed at their correct times, we ask this question to learn the correct times our religion states for these acts of worship. Can calendars be relied on in these matters?',
    'Answer: No calendar can be relied on in this matter. The explanation follows.',

    'Once in every revolution of the Moon around the Earth, the Moon and the Sun are on the same side of the Earth and the three lie on one line. This state is called ictimâ’-ı neyyireyn (conjunction). The side of the Moon facing us is then dark and we cannot see it. This period is called muhak. It is not fixed; it varies between 28 and 72 hours. The moment of conjunction is the exact middle of the muhak and is listed for every month in scientific calendars.',
    'Takiyyuddin Muhammad ibn Daqiq says that the crescent cannot be seen at all before 1–2 days have passed after the conjunction.',
    '2. On the beginning of Ramadan and the Eid',

    'The birth of the crescent is known by calculation, not by seeing, and what the calculation gives is certainly correct. But the crescent may be seen on the night of its birth, or not seen that night and seen on the second night. These calculations are not for finding when the lunar month begins; they are for knowing the night on which the crescent can be seen.',
    'Within the Hijri year the times of birth of the crescents can be calculated with certainty, but seeing the crescent with the naked eye from the Earth’s surface is possible only by observation (rasad). Hijri month beginnings become certain when the new crescent is seen by naked-eye observation. Because calendars are prepared in advance, the month beginnings in them are found by calculation. For worship, the month beginnings made certain by ru’yat are the basis.',
    'Research going back thousands of years has not made it possible to determine by calculation when the new crescent will be seen. The time of ru’yat cannot be calculated for the past or the future. Therefore calendars cannot be relied on, and ru’yat is required. This is the miracle in the hadith of our Prophet (peace be upon him): “Begin fasting when you see the crescent!”',
    'In Hijri calendars some months have 29 days and some 30, without a regular alternation. Searching the sky for the Ramadan crescent is an act of worship. Announcing the beginning of Ramadan in advance is a sign of not knowing Islam. For this reason Islamic scholars have stated that fixing the Hijri calendar by calculation is not permissible, and calendars cannot be relied on for fasting, Hajj and Qurban.',

    'Ibn Abidin (vol. 1, p. 289), on determining the qibla, says: “Calendars must not be relied on for knowing the first day of Ramadan. Fasting becomes obligatory by seeing the new moon in the sky. Our Prophet said: ‘Begin fasting when you see the crescent!’ The birth of the crescent is known by calculation, not by seeing; the calculation is correct and the crescent is born on the night it gives. But it may not be seen that night and may be seen a night later, and fasting must begin on the night it is seen, not the night it is born, because Islam commands so.”',
    'To say “we saw the crescent” on the night before the night given in calendars is wrong. Imam Subki says: “If someone says he saw the crescent on the 30th night of Sha’ban, while calculation shows it will be born a night later, the calculation is believed, because what is known by calculation is certain. It is impossible to see it a night before it is born.” [Beginning Ramadan by sighting may be one day after what calculation gives, but not one day before.] These calculations are not for finding when the month begins; they are for knowing the night on which the crescent can be seen. Imam Subki said the same. Do not be deceived by those who reverse his words.',
    'In every age and place Ramadan began by seeing the crescent. Now it is started by calculating the time of the crescent’s birth; this beginning is not in accordance with Islamic rulings.',
    'Fatawa al-Hindiyya also states that beginning Ramadan and the Eid by calendar or calculation is not permissible.',
    'When Ramadan begins in one place, fasting must begin everywhere in the world.',
    '3. On the beginning of Dhu al-Hijja',
    'The first day of Eid al-Adha is known by seeing the crescent of Dhu al-Hijja. The 9th day, the day of Arafah, is the day found by calculation or calendar, or the day after. The Hajj of those who go to Arafat one day before is not valid.',
    'One of the three obligatory parts of Hajj is standing at Arafat on the day of Arafah, from noon of the 9th of Dhu al-Hijja until dawn of the next day. [Standing at Arafat a day early or a day late invalidates the Hajj.]',
    'Where Ramadan and the Eid months are not established lawfully by witnesses, the first day of Dhu al-Hijja and from it the 10th day, the first day of Eid al-Adha, is calculated. The first day of the Eid is the day so found, or a day later. It cannot be a day earlier, because the Moon cannot be seen in the sky before it is born.',

        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;

        count += 1;

        throw count + ' != ' + numChars;
      }

      return unicodeMap;

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {

              bytes.push(b & 0xff);

          }

  function hijriOf(ymd, local) {
    const ld = lunarDayC(ymd, local); if (!ld) return null;
    const cur = { y: ld.hm.y, m: ld.hm.m }, prev = cur.m === 1 ? { y: cur.y - 1, m: 12 } : { y: cur.y, m: cur.m - 1 };
    const M = x => `${monthName(x.m)} ${x.y}`;
    if (ld.n <= 1) return { dayTxt: `1 | 29/30`, monthTxt: `${M(cur)} | ${M(prev)}`, html: `<b>1 ${esc(M(cur))}</b> ${t.hjOr} ${esc('29/30 ' + M(prev))}`, plain: `1 ${M(cur)} ${t.hjOr} 29/30 ${M(prev)}`, month: cur };
    const n = Math.min(ld.n, 30);
    return { dayTxt: `${n} | ${n - 1}`, monthTxt: M(cur), html: `<b>${n} ${esc(M(cur))}</b> <span>(${t.hjOr} ${n - 1})</span>`, plain: `${n} (${t.hjOr} ${n - 1}) ${M(cur)}`, month: cur };
